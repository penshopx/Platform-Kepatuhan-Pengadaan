openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Procurement workspace overview
  - name: packages
    description: Procurement package management
  - name: regulations
    description: Regulatory references
  - name: reviews
    description: Compliance review checklists
  - name: activity
    description: Workspace activity timeline
  - name: policy-packs
    description: Versioned compliance policy packs
  - name: evaluations
    description: Explainable compliance rule evaluations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get procurement workspace summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List procurement packages
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Procurement packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementPackage"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a procurement package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackage"
  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a procurement package
      parameters:
        - $ref: "#/components/parameters/PackageId"
      responses:
        "200":
          description: Procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackageDetail"
        "404":
          description: Package not found
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update a procurement package
      parameters:
        - $ref: "#/components/parameters/PackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: Updated procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackage"
  /regulations:
    get:
      operationId: listRegulations
      tags: [regulations]
      summary: List regulatory references
      responses:
        "200":
          description: Regulatory references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
  /reviews/epurchasing:
    get:
      operationId: listEpurchasingReviews
      tags: [reviews]
      summary: List e-purchasing review workpapers
      responses:
        "200":
          description: E-purchasing review workpapers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EpurchasingReview"
  /reviews/epurchasing/complete:
    post:
      operationId: completeEpurchasingReview
      tags: [reviews]
      summary: Mark an e-purchasing review item complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCompletionInput"
      responses:
        "200":
          description: Updated review workpaper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpurchasingReview"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent workspace activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /policy-packs/{id}/publish:
    post:
      operationId: publishPolicyPack
      tags: [policy-packs]
      summary: Publish a reviewed policy pack
      description: Creates immutable rule snapshots and publishes a reviewed policy pack.
      parameters:
        - $ref: "#/components/parameters/PolicyPackId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorRole"
        - $ref: "#/components/parameters/ActorTimestamp"
      security:
        - ActorSignature: []
      responses:
        "200":
          description: Published policy pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPolicyPack"
        "400":
          description: Policy pack cannot be published
        "401":
          description: Missing or invalid signed publisher identity
        "404":
          description: Policy pack not found
  /rule-evaluations:
    post:
      operationId: evaluateRules
      tags: [evaluations]
      summary: Evaluate a package against a published policy pack
      description: Evaluates immutable rule snapshots and stores an immutable decision reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleEvaluationInput"
      responses:
        "201":
          description: Explainable, reproducible compliance decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEvaluationResult"
        "400":
          description: Invalid evaluation input or formula
        "404":
          description: Published policy pack not found
components:
  parameters:
    PackageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PolicyPackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: x-actor-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ActorRole:
      name: x-actor-role
      in: header
      required: true
      schema:
        type: string
        enum: [POLICY_PUBLISHER, ADMIN]
    ActorTimestamp:
      name: x-actor-timestamp
      in: header
      required: true
      schema:
        type: string
  securitySchemes:
    ActorSignature:
      type: apiKey
      in: header
      name: x-actor-signature
      description: HMAC-SHA256 of timestamp, method, path, actor ID, and actor role using the server session secret.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required:
        - totalPackages
        - activePackages
        - reviewReady
        - complianceRate
        - totalBudget
        - budgetByMethod
      properties:
        totalPackages:
          type: integer
        activePackages:
          type: integer
        reviewReady:
          type: integer
        complianceRate:
          type: number
        totalBudget:
          type: number
        budgetByMethod:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucket"
    BudgetBucket:
      type: object
      required: [label, value, color]
      properties:
        label:
          type: string
        value:
          type: number
        color:
          type: string
    ProcurementPackage:
      type: object
      required:
        - id
        - code
        - title
        - agency
        - method
        - status
        - budget
        - pdnTarget
        - compliance
        - dueDate
        - owner
        - updatedAt
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        agency:
          type: string
        method:
          type: string
        status:
          type: string
        budget:
          type: number
        pdnTarget:
          type: number
        compliance:
          type: number
        dueDate:
          type: string
        owner:
          type: string
        updatedAt:
          type: string
    ProcurementPackageDetail:
      allOf:
        - $ref: "#/components/schemas/ProcurementPackage"
        - type: object
          required:
            - description
            - steps
            - documents
          properties:
            description:
              type: string
            steps:
              type: array
              items:
                $ref: "#/components/schemas/PackageStep"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/PackageDocument"
    PackageStep:
      type: object
      required: [label, status]
      properties:
        label:
          type: string
        status:
          type: string
        date:
          type: ["string", "null"]
    PackageDocument:
      type: object
      required: [name, type, status]
      properties:
        name:
          type: string
        type:
          type: string
        status:
          type: string
    PackageInput:
      type: object
      required: [title, agency, method, budget, owner]
      properties:
        title:
          type: string
          minLength: 1
        agency:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        owner:
          type: string
          minLength: 1
        dueDate:
          type: string
    PackageUpdate:
      type: object
      properties:
        status:
          type: string
        compliance:
          type: number
        pdnTarget:
          type: number
        dueDate:
          type: string
        owner:
          type: string
    Regulation:
      type: object
      required: [id, title, type, status, summary, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        status:
          type: string
        summary:
          type: string
        updatedAt:
          type: string
    EpurchasingReview:
      type: object
      required: [id, packageCode, packageTitle, status, completed, total, updatedAt, items]
      properties:
        id:
          type: integer
        packageCode:
          type: string
        packageTitle:
          type: string
        status:
          type: string
        completed:
          type: integer
        total:
          type: integer
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
    ReviewItem:
      type: object
      required: [id, label, group, completed]
      properties:
        id:
          type: integer
        label:
          type: string
        group:
          type: string
        completed:
          type: boolean
    ReviewCompletionInput:
      type: object
      required: [reviewId, itemId]
      properties:
        reviewId:
          type: integer
        itemId:
          type: integer
    Activity:
      type: object
      required: [id, actor, action, target, timestamp, tone]
      properties:
        id:
          type: integer
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        timestamp:
          type: string
        tone:
          type: string
    PublishedPolicyPack:
      type: object
      required: [id, packName, regimeType, version, status, publishedAt, publishedBy, ruleCount]
      properties:
        id:
          type: string
          format: uuid
        packName:
          type: string
        regimeType:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [PUBLISHED]
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        ruleCount:
          type: integer
          minimum: 1
    RuleEvaluationInput:
      type: object
      required: [entityType, entityId, policyPackId, context]
      properties:
        entityType:
          type: string
          minLength: 1
        entityId:
          type: string
          minLength: 1
        policyPackId:
          type: string
          format: uuid
        context:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
              - type: boolean
              - type: "null"
    RuleEvaluationResult:
      type: object
      required: [decisionReference, policyPack, input, output, rules]
      properties:
        decisionReference:
          type: string
          format: uuid
        policyPack:
          $ref: "#/components/schemas/EvaluatedPolicyPack"
        input:
          $ref: "#/components/schemas/RuleEvaluationInput"
        output:
          $ref: "#/components/schemas/EvaluationSummary"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleExplanation"
    EvaluatedPolicyPack:
      type: object
      required: [id, name, version, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [PUBLISHED]
    EvaluationSummary:
      type: object
      required: [status, passed, failed, mandatoryFailed, notApplicable]
      properties:
        status:
          type: string
          enum: [COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE]
        passed:
          type: integer
        failed:
          type: integer
        mandatoryFailed:
          type: integer
        notApplicable:
          type: integer
    RuleExplanation:
      type: object
      required: [rule, provision, source, verificationStatus, input, output]
      properties:
        rule:
          $ref: "#/components/schemas/EvaluatedRule"
        provision:
          $ref: "#/components/schemas/EvaluatedProvision"
        source:
          $ref: "#/components/schemas/EvaluatedSource"
        verificationStatus:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          $ref: "#/components/schemas/RuleOutput"
    EvaluatedRule:
      type: object
      required: [id, key, category, valueType, mandatory]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        valueType:
          type: string
        mandatory:
          type: boolean
    EvaluatedProvision:
      type: object
      required: [id, articleNumber, provisionType, rawText]
      properties:
        id:
          type: string
          format: uuid
        articleNumber:
          type: string
        provisionType:
          type: string
        rawText:
          type: string
    EvaluatedSource:
      type: object
      required: [id, regulationCode, title, issuingAuthority, authorityLevel, isBinding]
      properties:
        id:
          type: string
          format: uuid
        regulationCode:
          type: string
        title:
          type: string
        issuingAuthority:
          type: string
        authorityLevel:
          type: integer
        isBinding:
          type: boolean
    RuleOutput:
      type: object
      required: [status, value, referencedPaths]
      properties:
        status:
          type: string
          enum: [PASS, FAIL, NOT_APPLICABLE]
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: "null"
        referencedPaths:
          type: array
          items:
            type: string

