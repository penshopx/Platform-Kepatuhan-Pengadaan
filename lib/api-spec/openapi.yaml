openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Procurement workspace overview
  - name: packages
    description: Procurement package management
  - name: regulations
    description: Regulatory references
  - name: reviews
    description: Compliance review checklists
  - name: activity
    description: Workspace activity timeline
  - name: policy-packs
    description: Versioned compliance policy packs
  - name: evaluations
    description: Explainable compliance rule evaluations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get procurement workspace summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List procurement packages
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Procurement packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementPackage"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a procurement package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackage"
  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a procurement package
      parameters:
        - $ref: "#/components/parameters/PackageId"
      responses:
        "200":
          description: Procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackageDetail"
        "404":
          description: Package not found
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update a procurement package
      parameters:
        - $ref: "#/components/parameters/PackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: Updated procurement package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementPackage"
  /regulations:
    get:
      operationId: listRegulations
      tags: [regulations]
      summary: List regulatory references
      responses:
        "200":
          description: Regulatory references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
  /reviews/epurchasing:
    get:
      operationId: listEpurchasingReviews
      tags: [reviews]
      summary: List e-purchasing review workpapers
      responses:
        "200":
          description: E-purchasing review workpapers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EpurchasingReview"
  /reviews/epurchasing/complete:
    post:
      operationId: completeEpurchasingReview
      tags: [reviews]
      summary: Mark an e-purchasing review item complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCompletionInput"
      responses:
        "200":
          description: Updated review workpaper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpurchasingReview"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent workspace activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /legal-sources:
    get:
      operationId: listLegalSources
      tags: [legal-admin]
      summary: List legal sources and provisions
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Legal sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalSource"
    post:
      operationId: createLegalSource
      tags: [legal-admin]
      summary: Create a legal source
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalSourceInput"
      responses:
        "201":
          description: Created legal source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalSource"
  /legal-sources/{id}:
    patch:
      operationId: updateLegalSource
      tags: [legal-admin]
      summary: Update a legal source and verification status
      security:
        - ClerkSession: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalSourceUpdate"
      responses:
        "200":
          description: Updated legal source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalSource"
  /legal-sources/{id}/provisions:
    post:
      operationId: createProvision
      tags: [legal-admin]
      summary: Add a provision to a legal source
      security:
        - ClerkSession: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionInput"
      responses:
        "201":
          description: Created provision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provision"
  /business-rules:
    get:
      operationId: listBusinessRules
      tags: [legal-admin]
      summary: List versioned business rules and conditions
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Business rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessRule"
    post:
      operationId: createBusinessRule
      tags: [legal-admin]
      summary: Create a rule version and its application condition
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRuleInput"
      responses:
        "201":
          description: Created business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRule"
  /published-policy-packs:
    get:
      operationId: listPublishedPolicyPacks
      tags: [policy-packs]
      summary: List policy packs available for evaluation
      description: Returns only published policy packs and their rule counts for package evaluation.
      responses:
        "200":
          description: Published policy packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishedPolicyPack"
  /policy-packs:
    get:
      operationId: listPolicyPacks
      tags: [policy-packs]
      summary: List policy packs
      security:
        - ClerkSession: []
      responses:
        "200":
          description: Policy packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyPack"
    post:
      operationId: createPolicyPack
      tags: [policy-packs]
      summary: Create a draft policy pack
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPackInput"
      responses:
        "201":
          description: Created policy pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPack"
  /policy-packs/compare:
    get:
      operationId: comparePolicyPacks
      tags: [policy-packs]
      summary: Compare two versions of the same policy pack
      description: Read-only comparison using immutable snapshots for published versions and current rule data for unpublished versions.
      security:
        - ClerkSession: []
      parameters:
        - name: baseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: targetId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Policy pack comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPackComparison"
        "400":
          description: Invalid comparison or packs do not share the same name and regime
        "404":
          description: One or both policy packs were not found
  /policy-packs/{id}/rules:
    post:
      operationId: addPolicyPackRule
      tags: [policy-packs]
      summary: Add a rule to a mutable policy pack
      security:
        - ClerkSession: []
      parameters:
        - $ref: "#/components/parameters/PolicyPackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPackRuleInput"
      responses:
        "200":
          description: Updated policy pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPack"
  /policy-packs/{id}/status:
    patch:
      operationId: transitionPolicyPack
      tags: [policy-packs]
      summary: Review, publish, or retire a policy pack
      security:
        - ClerkSession: []
      parameters:
        - $ref: "#/components/parameters/PolicyPackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPackTransition"
      responses:
        "200":
          description: Updated policy pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPack"
        "400":
          description: Invalid transition or unverified legal source
  /policy-packs/{id}/publish:
    post:
      operationId: publishPolicyPack
      tags: [policy-packs]
      summary: Publish a reviewed policy pack
      description: Creates immutable rule snapshots and publishes a reviewed policy pack.
      parameters:
        - $ref: "#/components/parameters/PolicyPackId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorRole"
        - $ref: "#/components/parameters/ActorTimestamp"
      security:
        - ActorSignature: []
      responses:
        "200":
          description: Published policy pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPolicyPack"
        "400":
          description: Policy pack cannot be published
        "401":
          description: Missing or invalid signed publisher identity
        "404":
          description: Policy pack not found
  /rule-evaluations:
    post:
      operationId: evaluateRules
      tags: [evaluations]
      summary: Evaluate a package against a published policy pack
      description: Evaluates immutable rule snapshots and stores an immutable decision reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleEvaluationInput"
      responses:
        "201":
          description: Explainable, reproducible compliance decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEvaluationResult"
        "400":
          description: Invalid evaluation input or formula
        "404":
          description: Published policy pack not found
  /decisions:
    get:
      operationId: listDecisions
      tags: [evaluations]
      summary: List immutable decisions for an entity
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Immutable decisions ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredDecision"
        "400":
          description: Invalid entity filter
  /decisions/{decisionReference}:
    get:
      operationId: getDecision
      tags: [evaluations]
      summary: Get an immutable decision by reference
      description: Returns the stored policy pack, input, output, and rule explanations without evaluating rules again.
      parameters:
        - name: decisionReference
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stored immutable decision snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredDecision"
        "400":
          description: Invalid decision reference
        "404":
          description: Decision reference not found
components:
  parameters:
    PackageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PolicyPackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: x-actor-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ActorRole:
      name: x-actor-role
      in: header
      required: true
      schema:
        type: string
        enum: [POLICY_PUBLISHER, ADMIN]
    ActorTimestamp:
      name: x-actor-timestamp
      in: header
      required: true
      schema:
        type: string
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Authenticated Clerk session for an ADMIN or LEGAL_ADMIN user.
    ActorSignature:
      type: apiKey
      in: header
      name: x-actor-signature
      description: HMAC-SHA256 of timestamp, method, path, actor ID, and actor role using the server session secret.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required:
        - totalPackages
        - activePackages
        - reviewReady
        - complianceRate
        - totalBudget
        - budgetByMethod
      properties:
        totalPackages:
          type: integer
        activePackages:
          type: integer
        reviewReady:
          type: integer
        complianceRate:
          type: number
        totalBudget:
          type: number
        budgetByMethod:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucket"
    BudgetBucket:
      type: object
      required: [label, value, color]
      properties:
        label:
          type: string
        value:
          type: number
        color:
          type: string
    ProcurementPackage:
      type: object
      required:
        - id
        - code
        - title
        - agency
        - method
        - status
        - budget
        - pdnTarget
        - compliance
        - dueDate
        - owner
        - updatedAt
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        agency:
          type: string
        method:
          type: string
        status:
          type: string
        budget:
          type: number
        pdnTarget:
          type: number
        compliance:
          type: number
        dueDate:
          type: string
        owner:
          type: string
        updatedAt:
          type: string
    ProcurementPackageDetail:
      allOf:
        - $ref: "#/components/schemas/ProcurementPackage"
        - type: object
          required:
            - description
            - steps
            - documents
          properties:
            description:
              type: string
            steps:
              type: array
              items:
                $ref: "#/components/schemas/PackageStep"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/PackageDocument"
    PackageStep:
      type: object
      required: [label, status]
      properties:
        label:
          type: string
        status:
          type: string
        date:
          type: ["string", "null"]
    PackageDocument:
      type: object
      required: [name, type, status]
      properties:
        name:
          type: string
        type:
          type: string
        status:
          type: string
    PackageInput:
      type: object
      required: [title, agency, method, budget, owner]
      properties:
        title:
          type: string
          minLength: 1
        agency:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        budget:
          type: number
          minimum: 0
        owner:
          type: string
          minLength: 1
        dueDate:
          type: string
    PackageUpdate:
      type: object
      properties:
        status:
          type: string
        compliance:
          type: number
        pdnTarget:
          type: number
        dueDate:
          type: string
        owner:
          type: string
    Regulation:
      type: object
      required: [id, title, type, status, summary, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        status:
          type: string
        summary:
          type: string
        updatedAt:
          type: string
    EpurchasingReview:
      type: object
      required: [id, packageCode, packageTitle, status, completed, total, updatedAt, items]
      properties:
        id:
          type: integer
        packageCode:
          type: string
        packageTitle:
          type: string
        status:
          type: string
        completed:
          type: integer
        total:
          type: integer
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
    ReviewItem:
      type: object
      required: [id, label, group, completed]
      properties:
        id:
          type: integer
        label:
          type: string
        group:
          type: string
        completed:
          type: boolean
    ReviewCompletionInput:
      type: object
      required: [reviewId, itemId]
      properties:
        reviewId:
          type: integer
        itemId:
          type: integer
    Activity:
      type: object
      required: [id, actor, action, target, timestamp, tone]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        timestamp:
          type: string
        tone:
          type: string
        decisionReference:
          type: string
          format: uuid
        packageId:
          type: integer
    Provision:
      type: object
      required: [id, articleNumber, provisionType, rawText, sourceCategory]
      properties:
        id: { type: string, format: uuid }
        articleNumber: { type: string }
        clauseType: { type: ["string", "null"] }
        provisionType: { type: string }
        rawText: { type: string }
        interpretationNote: { type: ["string", "null"] }
        sourceCategory: { type: string }
    ProvisionInput:
      type: object
      required: [articleNumber, provisionType, rawText, sourceCategory]
      properties:
        articleNumber: { type: string, minLength: 1 }
        clauseType: { type: string }
        provisionType: { type: string, minLength: 1 }
        rawText: { type: string, minLength: 1 }
        interpretationNote: { type: string }
        sourceCategory: { type: string, minLength: 1 }
    LegalSource:
      type: object
      required: [id, regulationCode, regulationType, number, year, title, issuingAuthority, authorityLevel, isBinding, status, verificationStatus, createdAt, updatedAt, provisions]
      properties:
        id: { type: string, format: uuid }
        regulationCode: { type: string }
        regulationType: { type: string }
        number: { type: string }
        year: { type: integer }
        title: { type: string }
        issuingAuthority: { type: string }
        authorityLevel: { type: integer }
        effectiveDate: { type: ["string", "null"] }
        expiryDate: { type: ["string", "null"] }
        isBinding: { type: boolean }
        status: { type: string }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
        verifiedBy: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        provisions:
          type: array
          items:
            $ref: "#/components/schemas/Provision"
    LegalSourceInput:
      type: object
      required: [regulationCode, regulationType, number, year, title, issuingAuthority, authorityLevel, isBinding]
      properties:
        regulationCode: { type: string, minLength: 1 }
        regulationType: { type: string, minLength: 1 }
        number: { type: string, minLength: 1 }
        year: { type: integer, minimum: 1900 }
        title: { type: string, minLength: 1 }
        issuingAuthority: { type: string, minLength: 1 }
        authorityLevel: { type: integer, minimum: 1 }
        effectiveDate: { type: string }
        expiryDate: { type: string }
        isBinding: { type: boolean }
    LegalSourceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        status: { type: string }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
    RuleCondition:
      type: object
      required: [id, effectiveDate]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: ["string", "null"] }
        fundingSource: { type: ["string", "null"] }
        procurementMethod: { type: ["string", "null"] }
        packageValueMin: { type: ["number", "null"] }
        packageValueMax: { type: ["number", "null"] }
        scopeType: { type: ["string", "null"] }
        scopeId: { type: ["string", "null"] }
        effectiveDate: { type: string }
        expiryDate: { type: ["string", "null"] }
    BusinessRule:
      type: object
      required: [id, provisionId, ruleKey, ruleCategory, valueType, allowedReferences, version, isActive, sourceTitle, articleNumber, conditions]
      properties:
        id: { type: string, format: uuid }
        provisionId: { type: string, format: uuid }
        ruleKey: { type: string }
        ruleCategory: { type: string }
        defaultValue: {}
        valueType: { type: string }
        description: { type: ["string", "null"] }
        allowedReferences:
          type: array
          items: { type: string }
        version: { type: integer }
        isActive: { type: boolean }
        sourceTitle: { type: string }
        articleNumber: { type: string }
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleCondition"
    BusinessRuleInput:
      type: object
      required: [provisionId, ruleKey, ruleCategory, valueType, version, effectiveDate]
      properties:
        provisionId: { type: string, format: uuid }
        ruleKey: { type: string, minLength: 1 }
        ruleCategory: { type: string, minLength: 1 }
        defaultValue: {}
        valueType: { type: string, enum: [BOOLEAN, NUMBER, STRING] }
        description: { type: string }
        version: { type: integer, minimum: 1 }
        entityType: { type: string }
        fundingSource: { type: string }
        procurementMethod: { type: string }
        packageValueMin: { type: number, minimum: 0 }
        packageValueMax: { type: number, minimum: 0 }
        scopeType: { type: string }
        scopeId: { type: string }
        effectiveDate: { type: string }
        expiryDate: { type: string }
    PolicyPackRuleSummary:
      type: object
      required: [id, businessRuleId, ruleKey, ruleVersion, isMandatory, snapshotLocked]
      properties:
        id: { type: string, format: uuid }
        businessRuleId: { type: string, format: uuid }
        ruleKey: { type: string }
        ruleVersion: { type: integer }
        isMandatory: { type: boolean }
        snapshotLocked: { type: boolean }
    PolicyPack:
      type: object
      required: [id, packName, regimeType, version, status, createdAt, updatedAt, rules]
      properties:
        id: { type: string, format: uuid }
        packName: { type: string }
        regimeType: { type: string }
        description: { type: ["string", "null"] }
        version: { type: string }
        status: { type: string, enum: [DRAFT, REVIEWED, PUBLISHED, RETIRED] }
        publishedAt: { type: ["string", "null"] }
        publishedBy: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyPackRuleSummary"
    PolicyPackInput:
      type: object
      required: [packName, regimeType, version]
      properties:
        packName: { type: string, minLength: 1 }
        regimeType: { type: string, minLength: 1 }
        description: { type: string }
        version: { type: string, minLength: 1 }
    PolicyPackRuleInput:
      type: object
      required: [businessRuleId, ruleConditionId, isMandatory]
      properties:
        businessRuleId: { type: string, format: uuid }
        ruleConditionId: { type: string, format: uuid }
        isMandatory: { type: boolean }
    PolicyPackComparisonVersion:
      type: object
      required: [id, packName, regimeType, version, status, dataSource]
      properties:
        id: { type: string, format: uuid }
        packName: { type: string }
        regimeType: { type: string }
        version: { type: string }
        status: { type: string, enum: [DRAFT, REVIEWED, PUBLISHED, RETIRED] }
        dataSource: { type: string, enum: [SNAPSHOT, CURRENT] }
    PolicyPackComparisonRuleContent:
      type: object
      required: [ruleKey, ruleVersion, isMandatory, rule, condition, source, provision]
      properties:
        ruleKey: { type: string }
        ruleVersion: { type: integer }
        isMandatory: { type: boolean }
        rule: { type: object, additionalProperties: true }
        condition:
          type: [object, "null"]
          additionalProperties: true
        source: { type: object, additionalProperties: true }
        provision: { type: object, additionalProperties: true }
    PolicyPackComparisonChange:
      type: object
      required: [ruleKey, changeType, changedSections, before, after]
      properties:
        ruleKey: { type: string }
        changeType: { type: string, enum: [ADDED, REMOVED, CHANGED] }
        changedSections:
          type: array
          items: { type: string, enum: [RULE, CONDITION, SOURCE, PROVISION] }
        before:
          anyOf:
            - $ref: "#/components/schemas/PolicyPackComparisonRuleContent"
            - type: "null"
        after:
          anyOf:
            - $ref: "#/components/schemas/PolicyPackComparisonRuleContent"
            - type: "null"
    PolicyPackComparison:
      type: object
      required: [base, target, summary, changes]
      properties:
        base:
          $ref: "#/components/schemas/PolicyPackComparisonVersion"
        target:
          $ref: "#/components/schemas/PolicyPackComparisonVersion"
        summary:
          type: object
          required: [added, removed, changed]
          properties:
            added: { type: integer, minimum: 0 }
            removed: { type: integer, minimum: 0 }
            changed: { type: integer, minimum: 0 }
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PolicyPackComparisonChange"
    PolicyPackTransition:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [REVIEWED, PUBLISHED, RETIRED] }
    PublishedPolicyPack:
      type: object
      required: [id, packName, regimeType, version, status, publishedAt, publishedBy, ruleCount]
      properties:
        id:
          type: string
          format: uuid
        packName:
          type: string
        regimeType:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [PUBLISHED]
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        ruleCount:
          type: integer
          minimum: 1
    RuleEvaluationInput:
      type: object
      required: [entityType, entityId, policyPackId, context]
      properties:
        entityType:
          type: string
          minLength: 1
        entityId:
          type: string
          minLength: 1
        policyPackId:
          type: string
          format: uuid
        context:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
              - type: boolean
              - type: "null"
    RuleEvaluationResult:
      type: object
      required: [decisionReference, policyPack, input, output, rules]
      properties:
        decisionReference:
          type: string
          format: uuid
        policyPack:
          $ref: "#/components/schemas/EvaluatedPolicyPack"
        input:
          $ref: "#/components/schemas/RuleEvaluationInput"
        output:
          $ref: "#/components/schemas/EvaluationSummary"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleExplanation"
    StoredDecision:
      allOf:
        - $ref: "#/components/schemas/RuleEvaluationResult"
        - type: object
          required: [evaluatedAt, evaluatorVersion]
          properties:
            evaluatedAt:
              type: string
              format: date-time
            evaluatorVersion:
              type: string
    EvaluatedPolicyPack:
      type: object
      required: [id, name, version, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [PUBLISHED]
    EvaluationSummary:
      type: object
      required: [status, passed, failed, mandatoryFailed, notApplicable]
      properties:
        status:
          type: string
          enum: [COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE]
        passed:
          type: integer
        failed:
          type: integer
        mandatoryFailed:
          type: integer
        notApplicable:
          type: integer
    RuleExplanation:
      type: object
      required: [rule, provision, source, verificationStatus, input, output]
      properties:
        rule:
          $ref: "#/components/schemas/EvaluatedRule"
        provision:
          $ref: "#/components/schemas/EvaluatedProvision"
        source:
          $ref: "#/components/schemas/EvaluatedSource"
        verificationStatus:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          $ref: "#/components/schemas/RuleOutput"
    EvaluatedRule:
      type: object
      required: [id, key, category, valueType, mandatory]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        valueType:
          type: string
        mandatory:
          type: boolean
    EvaluatedProvision:
      type: object
      required: [id, articleNumber, provisionType, rawText]
      properties:
        id:
          type: string
          format: uuid
        articleNumber:
          type: string
        provisionType:
          type: string
        rawText:
          type: string
    EvaluatedSource:
      type: object
      required: [id, regulationCode, title, issuingAuthority, authorityLevel, isBinding]
      properties:
        id:
          type: string
          format: uuid
        regulationCode:
          type: string
        title:
          type: string
        issuingAuthority:
          type: string
        authorityLevel:
          type: integer
        isBinding:
          type: boolean
    RuleOutput:
      type: object
      required: [status, value, referencedPaths]
      properties:
        status:
          type: string
          enum: [PASS, FAIL, NOT_APPLICABLE]
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: "null"
        referencedPaths:
          type: array
          items:
            type: string

